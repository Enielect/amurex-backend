version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    command: ["serve"]
    ports:
      - "11434:11434"
    volumes:
       - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
    # GPU support for Linux/Windows (uncomment if you have NVIDIA GPU)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  web:
    build: .
    environment:
      - OPENAI_API_KEY=
      - SUPABASE_URL=
      - SUPABASE_ANON_KEY=
      - GROQ_API_KEY=
      - TOKENIZERS_PARALLELISM=
      - REDIS_URL=
      - REDIS_PASSWORD=
      - REDIS_PORT=
      - REDIS_USERNAME=
      - MXBAI_API_KEY=
      - RESEND_API_KEY=
      - RESEND_NOREPLY=

    ports:
      - "8080:8080"
volumes:
  ollama_data:
    driver: local

networks:
  default:
    name: ollama_network